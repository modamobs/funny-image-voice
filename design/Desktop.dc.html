<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #C9720C; text-decoration: none; }
    a:hover { color: #96530A; }
  </style>
</helmet>

<div style="width: 1280px; height: 900px; background: #FAF8F3; color: #12100E; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; overflow: hidden;">

  <!-- 제호 -->
  <div style="border-bottom: 3px solid #12100E;">
    <div style="max-width: 1168px; margin: 0 auto; padding: 18px 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <span style="font-family: 'Black Han Sans', sans-serif; font-size: 26px; letter-spacing: -0.015em;">개그대결 호외</span>
        <span style="font-size: 12px; color: #7A736A;">8월 25일 · 오전 9시 발행</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button style="height: 40px; padding: 0 14px; border: 2px solid #12100E; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 12.5px; font-weight: 700; cursor: pointer; color: #12100E;">관리</button>
        <button style="height: 40px; padding: 0 14px; border: 2px solid #12100E; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 12.5px; font-weight: 700; cursor: pointer; color: #12100E;">로그아웃</button>
        <div style="width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid #12100E; background: #FFFFFF;"></div>
      </div>
    </div>
  </div>

  <!-- 오늘의 판 -->
  <div style="max-width: 1168px; margin: 0 auto; padding: 30px 0 0; display: flex; gap: 26px; align-items: flex-start;">

    <!-- 무대 -->
    <div style="width: 700px; flex-shrink: 0; position: relative;">
      <div style="border: 3px solid #12100E; background: #141019; overflow: hidden; position: relative;">
        <div style="position: absolute; top: -150px; left: 50%; transform: translateX(-50%); width: 900px; height: 520px; background: radial-gradient(ellipse at 50% 0%, rgba(232,144,28,0.34) 0%, rgba(232,144,28,0.08) 46%, rgba(232,144,28,0) 72%); pointer-events: none;"></div>
        <svg viewBox="0 0 694 434" style="display: block; width: 100%; height: 434px; position: relative;">
          <circle cx="347" cy="222" r="122" fill="#241E2E"></circle>
          <path d="M264 148 L246 96 L306 128 Z" fill="#241E2E"></path>
          <path d="M430 148 L448 96 L388 128 Z" fill="#241E2E"></path>
          <circle cx="308" cy="203" r="19" fill="#FAF8F3"></circle>
          <circle cx="386" cy="203" r="19" fill="#FAF8F3"></circle>
          <circle cx="312" cy="208" r="8" fill="#141019"></circle>
          <circle cx="390" cy="208" r="8" fill="#141019"></circle>
          <ellipse cx="347" cy="256" rx="21" ry="14" fill="#141019"></ellipse>
          <path d="M347 270 q0 32 -32 36" stroke="#141019" stroke-width="8" fill="none" stroke-linecap="round"></path>
          <rect x="256" y="326" width="182" height="52" rx="3" fill="#E8901C"></rect>
        </svg>
      </div>
      <div style="position: absolute; right: -6px; bottom: -15px; background: #FFFFFF; border: 2.5px solid #12100E; padding: 7px 14px; font-size: 13px; font-weight: 700; transform: rotate(-1.5deg);">24명 참여 · 멘트 24개</div>
    </div>

    <!-- 사이드 -->
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px;">

      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
        <h1 style="margin: 0; font-family: 'Black Han Sans', sans-serif; font-size: 46px; line-height: 1.02; letter-spacing: -0.025em;">오늘의 짤</h1>
        <div style="border: 2.5px solid #12100E; background: #FFFFFF; padding: 6px 12px; text-align: center; flex-shrink: 0;">
          <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #7A736A;">마감까지</div>
          <div style="font-family: 'Black Han Sans', sans-serif; font-size: 22px; line-height: 1.15; color: #C9720C; font-variant-numeric: tabular-nums;">04:12:37</div>
        </div>
      </div>

      <button style="width: 100%; height: 62px; border: 3px solid #12100E; background: #E8901C; color: #12100E; font-family: 'Black Han Sans', sans-serif; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 5px 5px 0 #12100E;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#12100E" stroke-width="2.6" stroke-linecap="round">
          <rect x="9" y="2" width="6" height="11" rx="3"></rect>
          <path d="M5 10a7 7 0 0 0 14 0"></path>
          <path d="M12 17v4"></path>
        </svg>
        멘트 남기기
      </button>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2.5px solid #12100E; padding-bottom: 7px;">
          <span style="font-family: 'Black Han Sans', sans-serif; font-size: 18px;">중간 집계</span>
          <span style="font-size: 11.5px; color: #7A736A;">전체 보기</span>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; border: 2.5px solid #12100E; background: #FFF5E4; padding: 7px 13px;">
          <span style="font-family: 'Black Han Sans', sans-serif; font-size: 19px; width: 16px;">1</span>
          <button aria-label="개그왕김씨 멘트 듣기" style="width: 44px; height: 44px; border: 2.5px solid #12100E; background: #E8901C; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#12100E"><path d="M8 5v14l11-7z"></path></svg>
          </button>
          <span style="flex: 1; font-size: 14.5px; font-weight: 600; min-width: 0;">개그왕김씨</span>
          <span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">142표</span>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; border: 2.5px solid #12100E; background: #FFFFFF; padding: 7px 13px;">
          <span style="font-family: 'Black Han Sans', sans-serif; font-size: 19px; width: 16px; color: #7A736A;">2</span>
          <button aria-label="무명의연예인 멘트 듣기" style="width: 44px; height: 44px; border: 2.5px solid #12100E; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#12100E"><path d="M8 5v14l11-7z"></path></svg>
          </button>
          <span style="flex: 1; font-size: 14.5px; font-weight: 600; min-width: 0;">무명의연예인</span>
          <span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">98표</span>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; border: 2.5px solid #12100E; background: #FFFFFF; padding: 7px 13px;">
          <span style="font-family: 'Black Han Sans', sans-serif; font-size: 19px; width: 16px; color: #7A736A;">3</span>
          <button aria-label="조용한관객 멘트 듣기" style="width: 44px; height: 44px; border: 2.5px solid #12100E; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#12100E"><path d="M8 5v14l11-7z"></path></svg>
          </button>
          <span style="flex: 1; font-size: 14.5px; font-weight: 600; min-width: 0;">조용한관객</span>
          <span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">61표</span>
        </div>
      </div>

      <button style="width: 100%; height: 46px; border: 2.5px solid #12100E; background: #FFFFFF; color: #12100E; font-family: 'Black Han Sans', sans-serif; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#12100E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="15" rx="1"></rect>
          <circle cx="12" cy="12" r="3.5"></circle>
          <path d="M8 5l1.5-2h5L16 5"></path>
        </svg>
        내 짤 올리기
      </button>

    </div>
  </div>

  <!-- 지난 짤 -->
  <div style="max-width: 1168px; margin: 0 auto; padding: 42px 0 0;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2.5px solid #12100E; padding-bottom: 7px;">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 18px;">지난 짤</span>
      <span style="font-size: 11.5px; color: #7A736A;">128개</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 14px;">
      <div style="border: 2.5px solid #12100E; background: #FFFFFF;">
        <div style="height: 128px; background: #6B5A2E; border-bottom: 2.5px solid #12100E;"></div>
        <div style="padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: #7A736A;">멘트 31개</div>
      </div>
      <div style="border: 2.5px solid #12100E; background: #FFFFFF;">
        <div style="height: 128px; background: #2E5A4A; border-bottom: 2.5px solid #12100E;"></div>
        <div style="padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: #7A736A;">멘트 18개</div>
      </div>
      <div style="border: 2.5px solid #12100E; background: #FFFFFF;">
        <div style="height: 128px; background: #5A2E3E; border-bottom: 2.5px solid #12100E;"></div>
        <div style="padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: #7A736A;">멘트 44개</div>
      </div>
      <div style="border: 2.5px solid #12100E; background: #FFFFFF;">
        <div style="height: 128px; background: #2E3E5A; border-bottom: 2.5px solid #12100E;"></div>
        <div style="padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: #7A736A;">멘트 9개</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
