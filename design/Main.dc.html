<!doctype html>
<html>

<body>
<x-dc>
<helmet>

  <style>

    a { color: #C9720C; text-decoration: none; }
    a:hover { color: #96530A; }
  </style>

<div style="width: 390px; height: 844px; background: #FAF8F3; color: #12100E; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column;">

    <div style="width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid #12100E; background: #FFFFFF; flex-shrink: 0;"></div>
  </div>

  <!-- 헤드라인 -->
  <div style="padding: 16px 18px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">

      <div style="font-family: 'Black Han Sans', sans-serif; font-size: 19px; line-height: 1.15; color: #C9720C; font-variant-numeric: tabular-nums;">04:12:37</div>

  </div>

  <!-- 무대 위의 짤 -->
  <div style="margin: 13px 18px 0; position: relative;">
    <div style="border: 3px solid #12100E; background: #141019; overflow: hidden; position: relative;">
      <div style="position: absolute; top: -90px; left: 50%; transform: translateX(-50%); width: 460px; height: 300px; background: radial-gradient(ellipse at 50% 0%, rgba(232,144,28,0.34) 0%, rgba(232,144,28,0.08) 46%, rgba(232,144,28,0) 72%); pointer-events: none;"></div>
      <svg viewBox="0 0 348 202" style="display: block; width: 100%; height: 202px; position: relative;">
        <circle cx="174" cy="106" r="58" fill="#241E2E"></circle>
        <path d="M134 71 L125 46 L154 61 Z" fill="#241E2E"></path>
        <path d="M214 71 L223 46 L194 61 Z" fill="#241E2E"></path>
        <circle cx="155" cy="97" r="9" fill="#FAF8F3"></circle>
        <circle cx="193" cy="97" r="9" fill="#FAF8F3"></circle>

        <circle cx="195" cy="99" r="4" fill="#141019"></circle>
        <ellipse cx="174" cy="122" rx="10" ry="7" fill="#141019"></ellipse>
        <path d="M174 129 q0 15 -15 17" stroke="#141019" stroke-width="4" fill="none" stroke-linecap="round"></path>
        <rect x="126" y="156" width="96" height="28" rx="2" fill="#E8901C"></rect>
      </svg>
    </div>
    <!-- 말풍선 -->
    <div style="position: absolute; right: -3px; bottom: -13px; background: #FFFFFF; border: 2.5px solid #12100E; padding: 5px 11px; font-size: 12px; font-weight: 700; transform: rotate(-2deg);">24명 참여 중</div>
  </div>

  <!-- 중간 집계 -->
  <div style="padding: 26px 18px 0; display: flex; flex-direction: column; gap: 7px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2.5px solid #12100E; padding-bottom: 6px;">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 16px;">중간 집계</span>
      <span style="font-size: 11px; color: #7A736A;">전체 보기</span>
    </div>

    <div style="display: flex; align-items: center; gap: 11px; border: 2.5px solid #12100E; background: #FFF5E4; padding: 6px 11px;">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 18px; width: 14px;">1</span>
      <button aria-label="개그왕김씨 멘트 듣기" style="width: 44px; height: 44px; border: 2.5px solid #12100E; background: #E8901C; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#12100E"><path d="M8 5v14l11-7z"></path></svg>
      </button>
      <span style="flex: 1; font-size: 13.5px; font-weight: 600; min-width: 0;">개그왕김씨</span>
      <span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">142표</span>
    </div>

    <div style="display: flex; align-items: center; gap: 11px; border: 2.5px solid #12100E; background: #FFFFFF; padding: 6px 11px;">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 18px; width: 14px; color: #7A736A;">2</span>
      <button aria-label="무명의연예인 멘트 듣기" style="width: 44px; height: 44px; border: 2.5px solid #12100E; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#12100E"><path d="M8 5v14l11-7z"></path></svg>
      </button>
      <span style="flex: 1; font-size: 13.5px; font-weight: 600; min-width: 0;">무명의연예인</span>
      <span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">98표</span>
    </div>

    <div style="display: flex; align-items: center; gap: 11px; border: 2.5px solid #12100E; background: #FFFFFF; padding: 6px 11px;">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 18px; width: 14px; color: #7A736A;">3</span>
      <button aria-label="조용한관객 멘트 듣기" style="width: 44px; height: 44px; border: 2.5px solid #12100E; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#12100E"><path d="M8 5v14l11-7z"></path></svg>
      </button>
      <span style="flex: 1; font-size: 13.5px; font-weight: 600; min-width: 0;">조용한관객</span>
      <span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">61표</span>
    </div>
  </div>

  <!-- 지난 짤 -->
  <div style="padding: 20px 0 0 18px;">
    <div style="font-family: 'Black Han Sans', sans-serif; font-size: 13px; margin-bottom: 8px;">지난 짤</div>
    <div style="display: flex; gap: 8px;">
      <div style="width: 74px; height: 54px; border: 2.5px solid #12100E; background: #FFFFFF; flex-shrink: 0;"></div>
      <div style="width: 74px; height: 54px; border: 2.5px solid #12100E; background: #FFFFFF; flex-shrink: 0;"></div>
      <div style="width: 74px; height: 54px; border: 2.5px solid #12100E; background: #FFFFFF; flex-shrink: 0;"></div>
      <div style="width: 74px; height: 54px; border: 2.5px solid #12100E; background: #FFFFFF; flex-shrink: 0;"></div>
      <div style="width: 74px; height: 54px; border: 2.5px solid #12100E; background: #FFFFFF; flex-shrink: 0;"></div>
    </div>
  </div>

  <!-- CTA -->
  <div style="padding: 18px 18px 24px; margin-top: auto;">
    <button style="width: 100%; height: 58px; border: 3px solid #12100E; background: #E8901C; color: #12100E; font-family: 'Black Han Sans', sans-serif; font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px; box-shadow: 4px 4px 0 #12100E;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12100E" stroke-width="2.6" stroke-linecap="round">
        <rect x="9" y="2" width="6" height="11" rx="3"></rect>
        <path d="M5 10a7 7 0 0 0 14 0"></path>
        <path d="M12 17v4"></path>
      </svg>
      멘트 남기기

  </div>

</div>
</x-dc>

  renderVals() { return {}; }

</script>
</body>
</html>
