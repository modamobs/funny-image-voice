<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #C9720C; text-decoration: none; }
    a:hover { color: #96530A; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FAF8F3; color: #12100E; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column;">

  <!-- 제호 -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 15px 18px 11px; border-bottom: 3px solid #12100E;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 18px;">개그대결 호외</span>
      <span style="font-size: 10px; color: #7A736A;">제128호 · 마감</span>
    </div>
    <div style="width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid #12100E; background: #FFFFFF; flex-shrink: 0;"></div>
  </div>

  <!-- 우승 발표 -->
  <div style="margin: 16px 18px 0; border: 3px solid #12100E; background: #141019; color: #FAF8F3; position: relative; overflow: hidden; box-shadow: 5px 5px 0 #12100E;">
    <div style="position: absolute; top: -70px; left: 50%; transform: translateX(-50%); width: 460px; height: 260px; background: radial-gradient(ellipse at 50% 0%, rgba(232,144,28,0.32) 0%, rgba(232,144,28,0) 70%); pointer-events: none;"></div>
    <div style="position: relative; padding: 16px 16px 18px;">
      <div style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; color: #E8901C;">오늘의 우승 멘트</div>
      <div style="display: flex; gap: 13px; margin-top: 12px; align-items: center;">
        <div style="width: 84px; height: 84px; border: 2px solid #3A3246; background: #241E2E; flex-shrink: 0; overflow: hidden;">
          <svg viewBox="0 0 84 84" style="display: block; width: 100%; height: 100%;">
            <circle cx="42" cy="44" r="24" fill="#332B40"></circle>
            <path d="M26 30 L22 18 L36 26 Z" fill="#332B40"></path>
            <path d="M58 30 L62 18 L48 26 Z" fill="#332B40"></path>
            <circle cx="34" cy="40" r="4" fill="#FAF8F3"></circle>
            <circle cx="50" cy="40" r="4" fill="#FAF8F3"></circle>
            <ellipse cx="42" cy="51" rx="5" ry="3.5" fill="#141019"></ellipse>
          </svg>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-family: 'Black Han Sans', sans-serif; font-size: 19px; line-height: 1.25;">개그왕김씨</div>
          <div style="display: flex; align-items: baseline; gap: 5px; margin-top: 3px;">
            <span style="font-family: 'Black Han Sans', sans-serif; font-size: 24px; color: #E8901C; font-variant-numeric: tabular-nums;">142</span>
            <span style="font-size: 12px; color: #9C93A8;">표 · 24명 중 1위</span>
          </div>
        </div>
      </div>
      <button onClick="{{ onWinner }}" style="width: 100%; height: 48px; margin-top: 14px; border: 2.5px solid #E8901C; background: {{ winnerBg }}; color: {{ winnerFg }}; font-family: 'Black Han Sans', sans-serif; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="{{ winnerFg }}"><path d="{{ winnerIcon }}"></path></svg>
        {{ winnerLabel }}
      </button>
    </div>
  </div>

  <!-- 최종 집계 -->
  <div style="padding: 22px 18px 0; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2.5px solid #12100E; padding-bottom: 6px;">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 15px;">최종 집계</span>
      <span style="font-size: 11px; color: #7A736A;">멘트 24개</span>
    </div>

    <sc-for list="{{ rows }}" as="row" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 11px; border: 2.5px solid #12100E; background: {{ row.bg }}; padding: 5px 11px;">
        <span style="font-family: 'Black Han Sans', sans-serif; font-size: 17px; width: 14px; color: {{ row.rankColor }};">{{ row.rank }}</span>
        <button onClick="{{ row.toggle }}" aria-label="{{ row.aria }}" style="width: 44px; height: 44px; border: 2.5px solid #12100E; background: {{ row.btnBg }}; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#12100E"><path d="{{ row.icon }}"></path></svg>
        </button>
        <span style="flex: 1; font-size: 13.5px; font-weight: 600; min-width: 0;">{{ row.name }}</span>
        <span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">{{ row.votes }}표</span>
      </div>
    </sc-for>
  </div>

  <!-- 내 성적 -->
  <div style="padding: 16px 18px 0;">
    <div style="border: 2.5px solid #C9720C; background: #FFF5E4; padding: 11px 13px; display: flex; align-items: center; gap: 11px;">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 17px; color: #C9720C; width: 14px;">7</span>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 13.5px; font-weight: 700;">내 멘트</div>
        <div style="font-size: 11.5px; color: #7A736A; margin-top: 1px;">24명 중 7위 · 어제보다 3계단 올랐어요</div>
      </div>
      <span style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;">18표</span>
    </div>
  </div>

  <!-- CTA -->
  <div style="padding: 18px 18px 24px; margin-top: auto;">
    <button style="width: 100%; height: 58px; border: 3px solid #12100E; background: #E8901C; color: #12100E; font-family: 'Black Han Sans', sans-serif; font-size: 19px; cursor: pointer; box-shadow: 4px 4px 0 #12100E;">내일 짤 알림받기</button>
    <div style="text-align: center; margin-top: 12px; font-size: 12px; color: #7A736A;">내일 오전 9시에 새 짤이 열립니다</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: null };
  }
  toggle(id) {
    this.setState({ playing: this.state.playing === id ? null : id });
  }
  renderVals() {
    var self = this;
    var PLAY = 'M8 5v14l11-7z';
    var STOP = 'M7 7h10v10H7z';
    var data = [
      { id: 'a', rank: 1, name: '개그왕김씨', votes: 142 },
      { id: 'b', rank: 2, name: '무명의연예인', votes: 98 },
      { id: 'c', rank: 3, name: '조용한관객', votes: 61 },
      { id: 'd', rank: 4, name: '늦게온사람', votes: 47 }
    ];
    var playing = this.state.playing;
    var rows = data.map(function (d) {
      var on = playing === d.id;
      return {
        rank: d.rank,
        name: d.name,
        votes: d.votes,
        bg: d.rank === 1 ? '#FFF5E4' : '#FFFFFF',
        rankColor: d.rank === 1 ? '#12100E' : '#7A736A',
        btnBg: on ? '#C9302B' : (d.rank === 1 ? '#E8901C' : '#FFFFFF'),
        icon: on ? STOP : PLAY,
        aria: d.name + (on ? ' 멘트 정지' : ' 멘트 듣기'),
        toggle: function () { self.toggle(d.id); }
      };
    });
    var wOn = playing === 'winner';
    return {
      rows: rows,
      winnerBg: wOn ? '#E8901C' : 'transparent',
      winnerFg: wOn ? '#12100E' : '#E8901C',
      winnerIcon: wOn ? STOP : PLAY,
      winnerLabel: wOn ? '멈추기' : '우승 멘트 듣기',
      onWinner: function () { self.toggle('winner'); }
    };
  }
}
</script>
</body>
</html>
